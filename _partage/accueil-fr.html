<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/socle.css"><link rel="stylesheet" href="/assets/css/site.css">
<style>:root{--fond:#f5f0e8;--texte:#1a1614}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--fond);color:var(--texte)}
.carte{display:grid;grid-template-columns:1fr 1fr;width:1200px;height:630px}
.carte-texte{display:flex;flex-direction:column;justify-content:space-between;padding:64px}
.carte-texte img{width:72px;height:72px}
.carte-titre{font-family:var(--police-titres);font-size:64px;line-height:1.02;margin:0;text-wrap:balance}
.carte-nom{font-size:24px;font-weight:600;margin:0}
.carte-image{position:relative;background:center/cover no-repeat}.carte-ia{position:absolute;right:14px;bottom:14px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.66);color:#fff;font:600 15px/1.3 var(--police-texte)}.carte-titre{font-weight:450;font-variation-settings:'SOFT' 100,'WONK' 1}</style>
</head><body>
<div class="carte">
  <div class="carte-texte">
    <img src="/assets/images/logo.png" alt="">
    <p class="carte-titre">On lit vos textes</p>
    <p class="carte-nom">Le Quartier des Autrices et des Auteurs</p>
  </div>
  <div class="carte-image" style="background-image:url('/assets/images/site/q/composition.webp')"></div>
</div>
</body></html>
